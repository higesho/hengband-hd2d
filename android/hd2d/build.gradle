plugins {
    id 'com.android.application'
}

// 生成アセット（lib/・縮小タイル・voxel・フォント）の置き場。
// リポジトリには入れない（tools/build_android_hd2d_assets.py が作る）。
def generatedAssets = file("${rootDir}/build-assets-hd2d")

android {
    namespace 'org.hengband.hd2d'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.hengband.hd2d'
        // 旧 SDL2 UI 版（:app）と同じ線引き: Android 13 以降のみ
        minSdk 33
        targetSdk 35
        versionCode 30203
        versionName '3.0.2.3-hd2d-android'

        externalNativeBuild {
            cmake {
                arguments "-DHENGBAND_BUILD_CORES=${project.findProperty('hengbandBuildCores') == 'false' ? 'OFF' : 'ON'}",
                          '-DANDROID_STL=c++_shared',
                          '-DANDROID_ARM_NEON=ON'
                cppFlags '-std=c++20'
            }
        }
        ndk {
            abiFilters(*(project.findProperty('hengbandAbi') ?: 'arm64-v8a,x86_64').split(','))
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // SDLActivity 群は SDL2 の配布物をそのまま使う（改変しない）
            jniLibs.srcDirs += ["${rootDir}/core-import-jni"]
            java.srcDirs += ["${rootDir}/../third_party/android/SDL2/android-project/app/src/main/java"]
            assets.srcDirs += [generatedAssets]
        }
    }

    buildTypes {
        debug {
            // ネイティブは最適化して積む（未最適化だと描画とフロア生成が実用速度に届かない）。
            externalNativeBuild { cmake { arguments += ['-DCMAKE_BUILD_TYPE=RelWithDebInfo'] } }
        }
        // 実機で試すための APK。デバッグ鍵で署名する（正式署名は自分で行う）。
        preview {
            initWith debug
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            externalNativeBuild { cmake { arguments += ['-DCMAKE_BUILD_TYPE=Release'] } }
        }
        release {
            minifyEnabled false
            // 署名しない。Google Play へ出す前に自分が正式鍵で署名する。
            signingConfig null
            externalNativeBuild { cmake { arguments += ['-DCMAKE_BUILD_TYPE=Release'] } }
        }
    }

    // 既に圧縮済みの形式を APK 内で再圧縮しない（展開が速くなり、サイズはほぼ変わらない）。
    // .vox は MagicaVoxel 形式（RIFF 亜種・未圧縮）なので圧縮に任せる＝ここに書かない。
    androidResources {
        // libc++ の __algorithm など、先頭が _ のヘッダーディレクトリも同梱する。
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        noCompress += ['png', 'mp3', 'otf', 'ttf', 'ttc']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

// EUC の変換ツリー（transcodeCoreToEuc）は 2026-08-16 に廃止した。
// 内部 UTF-8 になったので、ソース（UTF-8）をそのまま組む（CMakeLists.txt を見よ）。

// アセットが未生成のままビルドすると「起動はするがデータが無い」APK ができてしまう。
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.doFirst {
            def marker = new File(generatedAssets, 'assets.manifest')
            if (!marker.exists()) {
                throw new GradleException(
                    "アセットが未生成です。先に次を実行してください:\n" +
                    "  python tools/build_android_hd2d_assets.py\n" +
                    "（生成先: ${generatedAssets}）")
            }
        }
    }
}
